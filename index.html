<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ÉLAN – J'apprends à ma façon</title><style>
*{box-sizing:border-box}body{margin:0;font:18px Verdana,sans-serif;background:#f2f7fa;color:#173c50}header,main{max-width:1100px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:38px}button,select,input{font:inherit}button{cursor:pointer;border:1px solid #a5bac5;border-radius:14px;padding:14px;background:white;color:inherit}button:focus-visible{outline:4px solid #e5a500}button:hover{border-color:#176785}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}.tile{min-height:180px;font-size:26px;font-weight:bold}.tile:nth-child(1){background:#d9edfc}.tile:nth-child(2){background:#dcefd9}.tile:nth-child(3){background:#ffead4}.tile span{display:block;font-size:55px;margin-bottom:15px}.panel{background:white;border-radius:20px;padding:24px;margin:18px 0;border:1px solid #cbdce4}label{display:block;margin:12px 0}select{max-width:100%;padding:8px} .choices{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}.choices button{min-width:100px}.sample{line-height:1.8;overflow-wrap:anywhere;padding:20px;border-radius:12px}.hero{display:flex;align-items:center;gap:24px;flex-wrap:wrap}.hero img{width:180px;border-radius:24px}.hero div{flex:1;min-width:220px}footer{text-align:center;padding:25px} [hidden]{display:none!important}.teen .hero img{display:none}.teen .tile{min-height:100px}.teen .tile span{font-size:32px}progress{width:100%;accent-color:#38845c} .good{background:#d9efdb!important;border-color:#38845c!important} .muted{font-size:14px} </style><body><header><div><h1>ÉLAN</h1>J’apprends à ma façon</div><div><button onclick="home()">⌂ Accueil</button> <button onclick="settings.hidden=!settings.hidden">⚙ Mes réglages</button></div></header><main><section id="settings" class="panel" hidden><h2>Mon confort de lecture</h2><label>Présentation <select id="age"><option value="child">Enfant</option><option value="teen">Adolescent</option></select></label><label>Écriture <select id="writing"><option value="script">Script</option><option value="capital">Capitales</option><option value="cursive">Cursive (aperçu)</option></select></label><label>Police <select id="font"><option>Verdana</option><option>Arial</option><option>Comic Sans MS</option><option>Tahoma</option></select></label><label>Taille <input id="size" type="range" min="20" max="52" value="32"></label><label>Espacement <input id="spacing" type="range" min="0" max="6" value="1"></label><label>Contraste <select id="contrast"><option value="normal">Normal</option><option value="high">Renforcé</option><option value="dark">Inversé</option></select></label><label>Fond de page <select id="paper"></select></label><label>Fond sous les lettres <select id="mark"></select></label><label><input type="checkbox" id="syll"> Syllabes en couleurs</label><label>Couleurs des syllabes <select id="palette"><option value="0">Bleu / rouge</option><option value="1">Vert / violet</option><option value="2">Bleu / orange</option></select></label><label><input type="checkbox" id="silent"> Lettres finales muettes grisées</label><label>Vitesse audio <select id="rate"><option value="1">Normale</option><option value="0.75">Lente</option></select></label><div id="preview" class="sample"></div><button onclick="settings.hidden=true">Fermer</button></section><section id="welcome"><div class="panel hero"><img src="mascotte.png" alt="Petit élan souriant"><div><h2>Bienvenue dans ton espace !</h2>Choisis ton activité. Avance à ton rythme.</div></div><div class="tiles"><button class="tile" onclick="start('lecture')"><span>📖</span>Lecture</button><button class="tile" onclick="start('maths')"><span>🔢</span>Maths</button><button class="tile" onclick="start('logique')"><span>🧩</span>Logique</button></div></section><section id="exercise" class="panel" hidden><h2 id="heading"></h2><progress id="progress" max="5" value="0"></progress><p id="count"></p><p id="instruction"></p><button onclick="speak(current().audio||current().q)">🔊 Écouter</button><div id="prompt" class="sample" style="text-align:center"></div><div id="choices" class="choices"></div><p id="feedback" role="status"></p><button id="next" hidden onclick="advance()">Suivant →</button></section></main><footer>Chacun apprend différemment. Chaque progrès compte.</footer><script>
const $=id=>document.getElementById(id), settings=$('settings');const colors=[['Blanc','#ffffff'],['Crème','#fff4d9'],['Bleu','#dceeff'],['Vert','#dff1dc'],['Rose','#f8dce8'],['Violet','#e9dfff'],['Jaune','#fff08a'],['Orange','#ffd4a3']];for(const id of ['paper','mark']){if(id==='mark')$(id).add(new Option('Aucun','none'));colors.forEach(([n,c])=>$(id).add(new Option(n,c)))}const ids=['age','writing','font','size','spacing','contrast','paper','mark','syll','palette','silent','rate'];let saved={};try{saved=JSON.parse(localStorage.getItem('elan-settings')||'{}')}catch{};ids.forEach(id=>{let e=$(id);if(id in saved){if(e.type==='checkbox')e.checked=saved[id];else e.value=saved[id]}e.addEventListener('input',apply)});const v=id=>$(id).value;function style(el){let dark=v('contrast')==='dark';el.style.background=dark?'#181818':v('contrast')==='high'?'#fff':v('paper');el.style.color=dark?'white':'#111';el.style.fontFamily=v('writing')==='cursive'?'cursive':v('font');el.style.fontSize=v('size')+'px';el.style.letterSpacing=v('spacing')+'px';el.style.textTransform=v('writing')==='capital'?'uppercase':'none'}function word(parts,m=0){let s=document.createElement('span'),marked=v('mark')!=='none',dark=v('contrast')==='dark'&&!marked; if(marked){s.style.background=v('mark');s.style.color='#111'}let palettes=dark?[['#a9d1ff','#ffb9bd'],['#a5edb5','#e4b9ff'],['#a9d1ff','#ffca90']]:[['#1857a5','#a82735'],['#176b40','#773b99'],['#1857a5','#914400']];parts.forEach((p,i)=>{let a=document.createElement('span');if($('syll').checked)a.style.color=palettes[+v('palette')][i%2];if(m&&i===parts.length-1&&$('silent').checked){a.textContent=p.slice(0,-m);let z=document.createElement('span');z.textContent=p.slice(-m);z.style.color=dark?'#bbb':'#666';a.append(z)}else a.textContent=p;s.append(a)});return s}function apply(){let o={};ids.forEach(id=>o[id]=$(id).type==='checkbox'?$(id).checked:v(id));try{localStorage.setItem('elan-settings',JSON.stringify(o))}catch{}document.body.classList.toggle('teen',v('age')==='teen');let p=$('preview');style(p);p.replaceChildren(word(['Un']), ' ',word(['pe','tit'],1),' ',word(['la','pin']),' ',word(['mange']),' ',word(['du']),' ',word(['cho','co','lat'],1),'.');if(!$('exercise').hidden)render(false)}function speak(t){if(!('speechSynthesis'in window)){$('feedback').textContent='Audio indisponible sur cet appareil.';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=+v('rate');speechSynthesis.speak(u)}const data={lecture:[['M','m',['n','m','r']],['R','r',['p','r','s']],['A','a',['o','e','a']],['L','l',['l','i','t']],['B','b',['d','p','b']]].map(([p,a,c])=>({p,a,c,q:'Retrouve la lettre minuscule qui correspond à '+p})),maths:[2,4,3,5,6].map(n=>({p:'● '.repeat(n),a:String(n),c:[String(n-1),String(n),String(n+1)],q:'Combien de points vois-tu ?'})),logique:[['● ■ ● ■','●',['■','●','▲']],['▲ ▲ ● ▲ ▲','●',['●','▲','■']],['1 2 1 2','1',['3','2','1']],['■ ● ▲ ■ ●','▲',['▲','■','●']],['2 4 2 4','2',['4','2','6']]].map(([p,a,c])=>({p,a,c,q:'Quel élément vient ensuite ?'}))};let domain='lecture',idx=0,done=false;function current(){return data[domain][idx]}function home(){$('welcome').hidden=false;$('exercise').hidden=true}function start(d){domain=d;idx=0;done=false;$('welcome').hidden=true;$('exercise').hidden=false;render()}function render(reset=true){let q=current();$('heading').textContent={lecture:'Je reconnais les lettres',maths:'Je dénombre',logique:'Je continue une suite'}[domain];$('count').textContent='Exercice '+(idx+1)+' sur 5';$('progress').value=idx+(done?1:0);$('instruction').textContent=q.q;let p=$('prompt');style(p);p.textContent=q.p;if(domain==='lecture')p.style.textTransform='none';let c=$('choices');c.replaceChildren();q.c.forEach(a=>{let b=document.createElement('button');b.textContent=a;style(b);if(domain==='lecture')b.style.textTransform='none';if(done&&a===q.a)b.classList.add('good');b.onclick=()=>{if(done)return;if(a===q.a){done=true;b.classList.add('good');$('feedback').textContent='Bravo, tu as réussi !';$('next').hidden=false;$('progress').value=idx+1}else $('feedback').textContent='Observe bien et essaie encore.'};c.append(b)});if(reset)$('feedback').textContent='';$('next').hidden=!done;$('next').textContent=idx===4?'Terminer':'Suivant →'}function advance(){if(idx===4){home();alert('Bravo ! Tu as terminé les cinq exercices.');return}idx++;done=false;render()}apply();</script></body></html>
